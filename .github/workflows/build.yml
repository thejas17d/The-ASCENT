name: Build game

# Builds the Android phone APK and the Windows game with Godot 4.4.1 on every
# push to main (or by hand from the Actions tab), uploads them as artifacts,
# and attaches them to a rolling "Latest build" pre-release so the APK can be
# downloaded straight onto a phone from the Releases page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # to update the "latest-build" release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1
  GODOT_RELEASE: 4.4.1-stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------------- Godot + export templates
      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          base=https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf godot.zip templates.tpz tpl

      # ---------------------------------------------------------------- signing key (stable across runs)
      # Uses the ANDROID_DEBUG_KEYSTORE_BASE64 secret if the repo has one; otherwise a
      # debug key made once and kept in the Actions cache, so each new APK installs as an
      # update over the last one. (The cache expires after 7 days without a build.)
      - name: Restore cached debug keystore
        uses: actions/cache@v4
        with:
          path: ~/ci-keystore
          key: android-debug-keystore-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p ~/ci-keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/ci-keystore/debug.keystore
            echo "Signing with the repository secret's keystore."
          elif [ ! -f ~/ci-keystore/debug.keystore ]; then
            keytool -genkeypair -keystore ~/ci-keystore/debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated a new debug keystore (cached for later runs)."
          else
            echo "Signing with the cached debug keystore."
          fi

      - name: Configure Godot editor settings (Android SDK, JDK, keystore)
        run: |
          set -e
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/ci-keystore/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.4.tres
          cat ~/.config/godot/editor_settings-4.4.tres
          ls "${ANDROID_SDK_ROOT}/build-tools" | tail -3

      # ---------------------------------------------------------------- import (cached between runs)
      - name: Cache imported assets
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_RELEASE }}-${{ hashFiles('**/*.import', 'project.godot') }}
          restore-keys: godot-import-${{ env.GODOT_RELEASE }}-

      - name: Import project
        run: |
          # twice: glTF scenes can import before the textures they reference
          timeout 30m ~/godot/godot --headless --path . --import || true
          timeout 20m ~/godot/godot --headless --path . --import

      # ---------------------------------------------------------------- export
      - name: Export Android APK
        run: |
          set -e
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/ci-keystore/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p build
          ~/godot/godot --headless --path . --export-debug "Android Phone" build/TheAscent-phone.apk
          test -s build/TheAscent-phone.apk
          ls -la build/TheAscent-phone.apk

      - name: Export Windows build
        run: |
          set -e
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/TheAscent.exe
          test -s build/windows/TheAscent.exe
          cd build/windows && zip -q -r ../TheAscent-windows.zip . && cd ../..
          ls -la build/TheAscent-windows.zip

      # ---------------------------------------------------------------- publish
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TheAscent-${{ github.sha }}
          path: |
            build/TheAscent-phone.apk
            build/TheAscent-windows.zip
          retention-days: 30
          compression-level: 0

      - name: Update the "Latest build" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(grep -m1 '^config/version=' project.godot | cut -d'"' -f2)
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build \
            build/TheAscent-phone.apk build/TheAscent-windows.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build — v${VERSION} (${GITHUB_SHA::7})" \
            --notes "Built automatically from \`${GITHUB_SHA::7}\` on $(date -u '+%Y-%m-%d %H:%M UTC').

          **Phone:** open this page on your Android phone, tap **TheAscent-phone.apk**, then open the download and allow *Install unknown apps* for your browser. (arm64 phones; debug-signed test build.)

          **Windows:** download **TheAscent-windows.zip**, unzip, run \`TheAscent.exe\` (keep \`TheAscent.pck\` next to it)."
